<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">小豆集市 · 开店卖数字商品</title>
  <desc id="hero-desc">标题：小豆集市。要点：成交才收 1.5%、自动发货、买家免注册、没有货源可去货源广场拿货、店铺打折自己定。右侧为开店四步：注册、资料、上架、开卖。</desc>
  <defs>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#F0B45A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F0B45A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="#141A2E"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" fill="none" stroke="#3A4463" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="56" y="88" font-size="20" letter-spacing="3" fill="#F0B45A">MARKETPLACE · 卖家开店资料</text>
    <text x="56" y="168" font-size="54" font-weight="700" fill="#FFF4E2">小豆集市</text>
    <rect x="56" y="186" width="96" height="6" rx="3" fill="#F0B45A"/>
    <text x="56" y="228" font-size="22" fill="#B9C0D6">开个店卖数字商品 · 自动发货 · 买家免注册 · 次日自动到账</text>

    <g font-size="20" fill="#FFF4E2">
      <rect x="56" y="252" width="196" height="44" rx="4" fill="#1D2540" stroke="#3A4463"/>
      <text x="80" y="281">成交才收 1.5%</text>
      <rect x="268" y="252" width="226" height="44" rx="4" fill="#1D2540" stroke="#3A4463"/>
      <text x="292" y="281">没货源也能开店</text>
      <rect x="510" y="252" width="226" height="44" rx="4" fill="#1D2540" stroke="#3A4463"/>
      <text x="534" y="281">店铺打折自己定</text>
    </g>

    <rect x="800" y="48" width="344" height="264" rx="4" fill="#1A2138" stroke="#3A4463"/>
    <text x="828" y="84" font-size="20" letter-spacing="2" fill="#F0B45A">开店四步</text>

    <g font-size="19" fill="#E9E2D2">
      <circle cx="836" cy="112" r="5" fill="#F0B45A"/><text x="856" y="118">① 注册（手机号）</text>
      <circle cx="836" cy="152" r="5" fill="#F0B45A"/><text x="856" y="158">② 提交资料（个人＝身份证）</text>
      <circle cx="836" cy="192" r="5" fill="#F0B45A"/><text x="856" y="198">③ 上架：发布商品或导卡密</text>
      <circle cx="836" cy="232" r="5" fill="#F0B45A"/><text x="856" y="238">④ 开卖：专属店铺链接</text>
      <circle cx="836" cy="272" r="5" fill="#8F97B2"/><text x="856" y="278" fill="#B9C0D6">（没货：先去货源广场拿货）</text>
    </g>
  </g>
</svg>
